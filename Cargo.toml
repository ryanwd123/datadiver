[package]
name = "datadiver"
version = "0.2.0"
edition = "2024"
authors = ["Ryan DeWitt"]
description = "Fast desktop data exploration with Polars and DuckDB"
license = "MIT"
repository = "https://github.com/ryanwd123/datadiver"
readme = "README.md"
publish = false

# The app is the root package and the default member, so plain `cargo build` and
# `cargo test` build only the app; `-p <crate>` or `--workspace` reach the others.
[workspace]
members = ["crates/*"]

[lib]
name = "datadiver"
path = "src/lib.rs"

[[bin]]
name = "datadiver"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[features]
default = []
snapshots = []

[dependencies]
# Reads Excel files for the Polars engine.
calamine = { version = "0.36", features = ["dates"] }
chrono = "0.4"
# The Monaco-style editor of the SQL panel, with SQL highlighting only.
code_editor = { path = "crates/code_editor", default-features = false, features = ["lang-sql"] }
# Parses the SQL panel's script for completion, highlighting and checks.
diver_sql = { path = "crates/diver_sql" }
duckdb = { version = "1.10505.0", features = ["bundled", "parquet", "appender-arrow"] }
# Polars already builds both; Polars exports use them for .gz and .zst text files.
flate2 = "1.1"
polars = { version = "0.55.2", default-features = false, features = [
    "lazy", "sql", "streaming", "csv", "parquet", "json", "ipc", "decompress",
    "temporal", "timezones", "dtype-full", "strings", "regex", "concat_str",
    "is_in", "round_series", "abs", "cum_agg", "mode", "approx_unique", "unique_counts",
    "cross_join", "semi_anti_join", "list_eval", "list_gather", "list_count", "list_sets",
    "list_drop_nulls", "propagate_nans", "fmt", "rows", "moment", "rank", "diff", "log",
    "sign", "trigonometry", "string_pad", "string_reverse", "string_to_integer", "replace",
    "is_between", "is_first_distinct", "extract_jsonpath", "binary_encoding", "bitwise",
    "range", "coalesce", "dynamic_group_by", "diagonal_concat", "cse", "product",
    "interpolate", "repeat_by", "month_start", "month_end", "offset_by", "zip_with", "cov",
    "top_k", "index_of", "string_normalize", "find_many", "list_to_struct",
] }
rust_xlsxwriter = "0.100"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tempfile = "3"
# Already built for DuckDB; the platform verifier trusts the Windows store.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
windows-numerics = "0.3"
zstd = "0.13"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Used by the release workflow; slower to build than `--release`, so local
# builds keep the default profile.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
strip = true
debug = false
