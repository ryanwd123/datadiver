[package]
name = "diver_sql"
version = "0.1.0"
edition = "2024"
description = "Editor-oriented DuckDB SQL parser: lossless syntax trees, completion, highlighting"
license = "MIT"
publish = false

[features]
# `MockCatalog`, an in-memory catalog for tests and examples.
mock = []
# Measures tests/duckdb_corpus.rs against DuckDB's own parser. The duckdb
# dependency has the app's features, so the bundled build is shared.
duckdb-diff = ["dep:duckdb"]

[dependencies]
rowan = "0.16"
duckdb = { version = "1.10505.0", features = ["bundled", "parquet", "appender-arrow"], optional = true }

[dev-dependencies]
# The integration tests use `MockCatalog`.
diver_sql = { path = ".", features = ["mock"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
expect-test = "1"
proptest = "1"

[[bench]]
name = "parse"
harness = false
